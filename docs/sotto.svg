  <text x="102" y="330" fill="#8fa5b2" font-family="system-ui,sans-serif" font-size="23">Speech without the wait.</text>
  <text x="102" y="466" fill="#6c8796" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">TEXT IN. VOICE OUT. YOUR STACK.</text>
